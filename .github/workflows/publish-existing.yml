name: Publish existing candidate
on:
  workflow_dispatch:
    inputs:
      digest:
        description: Existing image digest in this repository's GHCR package
        required: true
        type: string
permissions:
  contents: read
  packages: write
  id-token: write
concurrency:
  group: k17-candidate
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: sigstore/cosign-installer@828df1e55de306ba29db814d6057ddae71883cda
      - name: Sign and publish existing candidate
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ inputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          export DOCKER_CONFIG="$RUNNER_TEMP/docker"
          mkdir -p "$DOCKER_CONFIG"
          export REGISTRY_AUTH_FILE="$DOCKER_CONFIG/config.json"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$REGISTRY_TOKEN" | podman login --authfile "$REGISTRY_AUTH_FILE" ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          podman pull "$image@$IMAGE_DIGEST"
          source=$(podman image inspect --format '{{index .Labels "org.opencontainers.image.source"}}' "$image@$IMAGE_DIGEST")
          test "$source" = "https://github.com/$GITHUB_REPOSITORY"
          cosign sign --yes "$image@$IMAGE_DIGEST"
          podman tag "$image@$IMAGE_DIGEST" "$image:candidate"
          podman push --digestfile published.digest "$image:candidate"
          test "$(cat published.digest)" = "$IMAGE_DIGEST"
          printf 'Signed candidate: `%s@%s`\n' "$image" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
