name: Build private candidate
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: k17-candidate
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
      - uses: sigstore/cosign-installer@828df1e55de306ba29db814d6057ddae71883cda
      - name: Build and push candidate
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/docker"
          mkdir -p "$DOCKER_CONFIG"
          export REGISTRY_AUTH_FILE="$DOCKER_CONFIG/config.json"
          image="ghcr.io/${GITHUB_REPOSITORY,,}-private"
          package_api="https://api.github.com/users/$GITHUB_REPOSITORY_OWNER/packages/container/${GITHUB_REPOSITORY#*/}-private"
          status=$(curl -sS -o package.json -w '%{http_code}' -H "Authorization: Bearer $REGISTRY_TOKEN" "$package_api")
          if [ "$status" = 200 ]; then
            jq -e '.visibility == "private"' package.json
          else
            test "$status" = 404
          fi
          printf '%s' "$REGISTRY_TOKEN" | podman login --authfile "$REGISTRY_AUTH_FILE" ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          podman build --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$image:sha-$GITHUB_SHA" .
          podman push --digestfile image.digest "$image:sha-$GITHUB_SHA"
          digest=$(cat image.digest)
          curl --fail --silent --show-error -H "Authorization: Bearer $REGISTRY_TOKEN" "$package_api" | jq -e '.visibility == "private"'
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY --tlog-upload=false "$image@$digest"
          podman tag "$image:sha-$GITHUB_SHA" "$image:candidate"
          podman push "$image:candidate"
          printf 'Private candidate: `%s@%s`\n\nNo stable promotion or client update was performed.\n' "$image" "$digest" >> "$GITHUB_STEP_SUMMARY"
