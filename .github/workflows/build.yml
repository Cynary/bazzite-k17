name: Build candidate
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
  id-token: write
concurrency:
  group: k17-candidate
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
      - uses: sigstore/cosign-installer@828df1e55de306ba29db814d6057ddae71883cda
      - name: Build and push candidate
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$REGISTRY_TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          podman build --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$image:sha-$GITHUB_SHA" .
          podman push --digestfile image.digest "$image:sha-$GITHUB_SHA"
          digest=$(cat image.digest)
          cosign sign --yes "$image@$digest"
          podman tag "$image:sha-$GITHUB_SHA" "$image:candidate"
          podman push "$image:candidate"
          printf 'Candidate: `%s@%s`\n\nNo stable promotion or client update was performed.\n' "$image" "$digest" >> "$GITHUB_STEP_SUMMARY"
