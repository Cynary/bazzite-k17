   <g id="text_4">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="634.366239" y="270.228544" transform="rotate(-0 634.366239 270.228544)">Export → pace → present</text>
   </g>
   <g id="text_5">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(176.480763 93.766511)">Decode statistic ends</text>
