  <g id="text_8">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start" x="34.56" y="20.693344" transform="rotate(-0 34.56 20.693344)">The decode statistic stops before the GPU necessarily does</text>
  </g>
  <g id="text_9">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start" x="34.56" y="361.584" transform="rotate(-0 34.56 361.584)">A frame handle identifies a GPU surface. It does not certify that decoding into that surface has finished.</text>
  </g>
  <g id="text_10">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="34.56" y="379.08" transform="rotate(-0 34.56 379.08)">Our worker synchronizes before using the pixels. Other pipelines can enforce the dependency without blocking the CPU.</text>
  </g>
